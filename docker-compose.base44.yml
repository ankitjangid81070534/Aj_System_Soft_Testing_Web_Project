services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: unless-stopped
    env_file:
      - path: /run/base44/app.env
        required: false
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-localhost}
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    volumes:
      - ./website:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  web_node_modules:
