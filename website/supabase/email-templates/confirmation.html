<div
  style="
    font-family: Arial, Helvetica, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #e4e7ee;
    border-radius: 20px;
    overflow: hidden;
  "
>
  <div style="background: #0a6fd6; padding: 24px; color: #fff; font-size: 20px; font-weight: 700">
    AJ System Soft Technology
  </div>
  <div style="padding: 28px; color: #2a3447">
    <h1 style="margin: 0 0 14px; color: #16181c; font-size: 24px">Confirm your account</h1>
    <p style="margin: 0 0 20px; line-height: 1.6">
      Confirm your email address to activate your secure AJ System Soft Technology client portal.
    </p>
    <a
      href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup&next=/account"
      style="
        display: inline-block;
        background: #0a6fd6;
        color: #fff;
        padding: 12px 20px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
      "
      >Confirm email address</a
    >
    <p style="margin: 22px 0 0; color: #626872; font-size: 13px; line-height: 1.6">
      If you did not create this account, you can safely ignore this email.
    </p>
    <p style="margin: 22px 0 0; color: #626872; font-size: 12px">
      Software built around your requirements.
    </p>
  </div>
</div>
